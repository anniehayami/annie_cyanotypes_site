<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop &mdash; Annie Cyanotypes</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <a href="https://instagram.com/annie_hayami" class="site-social" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="index.html" class="site-logo">
        <img src="images/logo.png" alt="Annie's Cyanotypes" class="site-logo-image" />
      </a>
      <nav class="site-nav" data-nav>
        <a href="category.html">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    </div>
  </header>

  <div class="page-title" data-page-title>
    <h1>Prints</h1>
  </div>

  <nav class="shop-filters" data-shop-filters></nav>

  <nav class="shop-sub-breadcrumb breadcrumb" data-shop-breadcrumb style="display:none;"></nav>

  <div class="container">
    <div class="product-grid" data-product-grid></div>
    <p class="empty-state" data-empty-state style="display:none;">
      No prints in this category yet &mdash; check back soon.
    </p>
  </div>

  <footer class="site-footer">
    <div class="footer-social">
      <a href="https://instagram.com/annie_hayami" aria-label="Instagram">Instagram</a>
      <a href="mailto:hello@example.com" aria-label="Contact Me">Contact Me</a>
    </div>
    <p class="footer-copy">&copy; 2026 Annie. All rights reserved.</p>
    <a href="promo.html" class="footer-promo-link">Have a gift code?</a>
  </footer>

  <div class="checkout-modal" id="checkout-modal">
    <div class="checkout-modal-inner">
      <button class="checkout-modal-close" data-checkout-close aria-label="Close">&times;</button>
      <div id="checkout-container"></div>
    </div>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="js/config.js"></script>
  <script src="js/checkout.js?v=2"></script>
  <script src="js/promo.js?v=2"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
