<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annie Cyanotypes</title>
  <meta name="description" content="Original cyanotype prints, made by hand." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header" data-controller="header">
    <div class="site-header-inner">
      <a href="index.html" class="site-logo">
        <img src="images/logo.png" alt="Annie's Cyanotypes" class="site-logo-image" />
      </a>
      <nav class="site-nav" data-nav>
        <a href="category.html">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    </div>
  </header>

  <section class="hero" data-hero>
    <div class="hero-content">
      <h1 data-hero-title>Cyanotype Artist</h1>
      <a class="btn" href="category.html">Shop Prints</a>
    </div>
  </section>

  <section class="about-section">
    <img class="about-photo" src="images/artist.jpg" alt="" />
    <div class="about-text section-narrow">
      <h2>About</h2>
      <p>
        Replace this with a short line or two about your sister &mdash; her process, materials,
        and what draws her to cyanotype printing.
      </p>
    </div>
  </section>

  <div class="category-gallery" data-category-gallery></div>

  <footer class="site-footer">
    <div class="footer-social">
      <a href="https://instagram.com/" aria-label="Instagram">Instagram</a>
      <a href="mailto:hello@example.com" aria-label="Email">Email</a>
    </div>
    <p class="footer-copy">&copy; 2026 Annie. All rights reserved.</p>
  </footer>

  <div class="checkout-modal" id="checkout-modal">
    <div class="checkout-modal-inner">
      <button class="checkout-modal-close" data-checkout-close aria-label="Close">&times;</button>
      <div id="checkout-container"></div>
    </div>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="js/config.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
