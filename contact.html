<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact &mdash; Annie Cyanotypes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <a href="https://instagram.com/" class="site-social" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="index.html" class="site-logo">
        <img src="images/logo.png" alt="Annie's Cyanotypes" class="site-logo-image" />
      </a>
      <nav class="site-nav" data-nav>
        <a href="category.html">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    </div>
  </header>

  <section class="section">
    <div class="section-narrow">
      <h2>Contact</h2>
      <p>Questions about a print, a custom order, or shipping? Send a message below.</p>
    </div>

    <!--
      Netlify Forms: once this site is deployed on Netlify, this form is detected
      automatically and submissions show up in the Netlify dashboard. Turn on
      email notifications there (Site settings -> Forms -> Notifications) to have
      submissions forwarded to your sister's inbox -- no code changes needed.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
      <input type="hidden" name="form-name" value="contact" />
      <p class="hidden">
        <label>Don't fill this out if you're human: <input name="bot-field" /></label>
      </p>

      <label>
        Name
        <input type="text" name="name" required />
      </label>

      <label>
        Email
        <input type="email" name="email" required />
      </label>

      <label>
        Message
        <textarea name="message" required></textarea>
      </label>

      <button type="submit" class="btn" style="background:#1a1a1a;color:#fff;">Send</button>
    </form>
  </section>

  <footer class="site-footer">
    <div class="footer-social">
      <a href="https://instagram.com/" aria-label="Instagram">Instagram</a>
      <a href="mailto:hello@example.com" aria-label="Contact Me">Contact Me</a>
    </div>
    <p class="footer-copy">&copy; 2026 Annie. All rights reserved.</p>
  </footer>

</body>
</html>
